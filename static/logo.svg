<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF"/>
      <stop offset="100%" style="stop-color:#0080FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="30" fill="#000814"/>

  <g transform="translate(32,32)">
    <!-- Outer ring with gradient -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#fireGrad)" stroke-width="2" opacity="0.9"/>

    <!-- Neural network web pattern -->
    <path d="M 0,-20 L 12,-8 L 20,0 L 12,8 L 0,20 L -12,8 L -20,0 L -12,-8 Z"
          fill="none" stroke="url(#glowGrad)" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Central core with gradient -->
    <circle cx="0" cy="0" r="8" fill="url(#fireGrad)"/>

    <!-- Corner connectors for web/spider effect -->
    <path d="M -18,-18 Q -18,-10 -10,-10 M 18,-18 Q 18,-10 10,-10 M -18,18 Q -18,10 -10,10 M 18,18 Q 18,10 10,10"
          stroke="#4B5563" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Data nodes -->
    <circle cx="-20" cy="-20" r="2" fill="#00D9FF"/>
    <circle cx="20" cy="-20" r="2" fill="#00D9FF"/>
    <circle cx="-20" cy="20" r="2" fill="#00D9FF"/>
    <circle cx="20" cy="20" r="2" fill="#00D9FF"/>

    <!-- Inner star representing intelligence -->
    <path d="M 0,-8 L 3,-3 L 8,0 L 3,3 L 0,8 L -3,3 L -8,0 L -3,-3 Z"
          fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>